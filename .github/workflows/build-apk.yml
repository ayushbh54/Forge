name: Build & Release Nirmaan OS Flutter APK

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish formal GitHub Release with downloadable APK'
        required: true
        type: boolean
        default: true
      version_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0-rc1'
      backend_api_url:
        description: 'Production Backend API URL (e.g. https://nirmaan-backend.onrender.com)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 3. Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: 4. Display Flutter & Dart Info
        run: |
          flutter --version
          dart --version

      - name: 5. Install Flutter Dependencies
        working-directory: ./nirmaan_app
        run: flutter pub get

      - name: 6. Run Static Analysis & Verification
        working-directory: ./nirmaan_app
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: 7. Run Automated Tests
        working-directory: ./nirmaan_app
        run: flutter test test/localization_test.dart

      - name: 8. Build Release Universal APK
        working-directory: ./nirmaan_app
        run: |
          EXTRA_ARGS=""
          if [ -n "${{ github.event.inputs.backend_api_url }}" ]; then
            EXTRA_ARGS="--dart-define=API_URL=${{ github.event.inputs.backend_api_url }}"
          fi
          flutter build apk --release --no-tree-shake-icons $EXTRA_ARGS

      - name: 9. Build Split Architecture APKs (ARM64, ARMv7, x86_64)
        working-directory: ./nirmaan_app
        run: |
          EXTRA_ARGS=""
          if [ -n "${{ github.event.inputs.backend_api_url }}" ]; then
            EXTRA_ARGS="--dart-define=API_URL=${{ github.event.inputs.backend_api_url }}"
          fi
          flutter build apk --split-per-abi --no-tree-shake-icons $EXTRA_ARGS

      - name: 10. Copy and Rename APKs for Distribution
        run: |
          mkdir -p release-apks
          cp nirmaan_app/build/app/outputs/flutter-apk/app-release.apk release-apks/Nirmaan-OS-Universal-v1.0.0.apk
          cp nirmaan_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-apks/Nirmaan-OS-arm64-v8a.apk || true
          cp nirmaan_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release-apks/Nirmaan-OS-armeabi-v7a.apk || true
          cp nirmaan_app/build/app/outputs/flutter-apk/app-x86_64-release.apk release-apks/Nirmaan-OS-x86_64.apk || true
          ls -la release-apks/

      - name: 11. Upload Universal APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nirmaan-OS-Universal-APK
          path: release-apks/Nirmaan-OS-Universal-v1.0.0.apk
          retention-days: 30

      - name: 12. Upload All Architecture APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nirmaan-OS-All-Architecture-APKs
          path: release-apks/*.apk
          retention-days: 30

      - name: 13. Create GitHub Release with APK Downloads
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version_tag || github.ref_name }}
          name: "Nirmaan OS Release ${{ github.event.inputs.version_tag || github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-apks/Nirmaan-OS-Universal-v1.0.0.apk
            release-apks/Nirmaan-OS-arm64-v8a.apk
            release-apks/Nirmaan-OS-armeabi-v7a.apk
            release-apks/Nirmaan-OS-x86_64.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
